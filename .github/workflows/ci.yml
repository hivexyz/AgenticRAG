name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff syntax gate
        run: uvx ruff check app tests migrations scripts --select E9,F --ignore F401

      - name: Run backend tests
        run: uv run pytest -q

      - name: Check Alembic head
        run: uv run alembic heads

      - name: Run offline eval
        run: >
          uv run python tests/eval/eval_runner.py
          --cases tests/eval/eval_cases.jsonl
          --results tests/eval/recorded_results.jsonl
          --min-recall-at-k 0.95
          --min-citation-accuracy 0.95
          --min-answer-must-mention-accuracy 0.95
          --min-refusal-accuracy 0.95
          --max-p95-latency-ms 3000

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
